<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas familiares</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #22252f; --border: #2a2d3a;
  --text: #e4e4e7; --text-muted: #8b8d98; --accent: #6366f1; --green: #22c55e;
  --red: #ef4444; --orange: #f59e0b; --cyan: #06b6d4;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 24px; max-width: 1440px; margin: 0 auto; }
h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
.subtitle { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 20px; }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { padding: 7px 18px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; transition: all 0.15s; }
.tab:hover { border-color: var(--accent); color: var(--text); }
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.tab.compare { border-color: var(--orange); }
.tab.compare.active { background: var(--orange); }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 24px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.kpi .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.kpi .val { font-size: 1.5rem; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
.neg { color: var(--red); } .pos { color: var(--green); } .neut { color: var(--accent); } .warn { color: var(--orange); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
.card.full { grid-column: 1 / -1; }
.card h3 { font-size: 0.85rem; font-weight: 600; margin-bottom: 12px; color: var(--text-muted); }

.alert-bar { background: var(--surface); border: 1px solid var(--orange); border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; display: none; }
.alert-bar .alert-title { font-size: 0.75rem; text-transform: uppercase; color: var(--orange); font-weight: 600; margin-bottom: 8px; }
.alert-bar ul { list-style: none; padding: 0; }
.alert-bar li { font-size: 0.82rem; padding: 3px 0; color: var(--text-muted); }
.alert-bar li .alert-icon { margin-right: 6px; }

.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 10px; border-bottom: 1px solid var(--border); }
.tbl th.r { text-align: right; }
.tbl td { padding: 8px 10px; font-size: 0.82rem; border-bottom: 1px solid rgba(42,45,58,0.5); }
.tbl td.amt { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.pct { text-align: right; color: var(--text-muted); font-size: 0.75rem; }
.tbl td.delta { text-align: right; font-size: 0.75rem; }
.tbl td.bar-cell { width: 25%; }
.bar { height: 7px; border-radius: 3px; background: var(--accent); opacity: 0.6; transition: width 0.3s; }
.tbl tr:hover .bar { opacity: 1; }
.tbl tr.subrow td { padding-left: 28px; font-size: 0.78rem; color: var(--text-muted); }
.tbl tr.subrow td.amt { color: var(--text-muted); }
.delta-up { color: var(--red); } .delta-down { color: var(--green); }

.toggle-subs { cursor: pointer; user-select: none; }
.toggle-subs:hover td:first-child { color: var(--accent); }
.toggle-indicator { font-size: 0.65rem; color: var(--text-muted); margin-left: 6px; }
.toggle-subs.open .toggle-indicator { transform: rotate(90deg); display: inline-block; }
.detail-btn { background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--text-muted); cursor: pointer; font-size: 0.65rem; padding: 2px 6px; margin-left: 8px; transition: all 0.15s; vertical-align: middle; }
.detail-btn:hover { border-color: var(--accent); color: var(--text); }
.detail-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.detail-panel { background: var(--surface2); border-top: 1px solid var(--border); }
.detail-panel td { padding: 12px 16px !important; }
.detail-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.detail-col h4 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 8px; }
.detail-col ul { list-style: none; padding: 0; margin: 0; max-height: 240px; overflow-y: auto; }
.detail-col li { font-size: 0.78rem; padding: 3px 0; display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid rgba(42,45,58,0.3); }
.detail-col li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail-col li .val { white-space: nowrap; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.detail-col .pattern-list { columns: 2; column-gap: 16px; }
.detail-col .pattern-list li { display: block; font-size: 0.75rem; color: var(--text-muted); padding: 2px 0; border: none; font-family: monospace; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.card-header h3 { margin-bottom: 0; }
.expand-all-btn { padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font-size: 0.75rem; transition: all 0.15s; }
.expand-all-btn:hover { border-color: var(--accent); color: var(--text); }

.savings-bar { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.savings-track { flex: 1; height: 10px; background: var(--surface2); border-radius: 5px; overflow: hidden; }
.savings-fill { height: 100%; border-radius: 5px; transition: width 0.4s; }

.insight-item { padding: 10px 0; border-bottom: 1px solid rgba(42,45,58,0.4); }
.insight-item:last-child { border-bottom: none; }
.insight-item .insight-type { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px; }
.insight-item .insight-type.up { color: var(--red); }
.insight-item .insight-type.down { color: var(--green); }
.insight-item .insight-type.info { color: var(--cyan); }
.insight-item .insight-text { font-size: 0.82rem; color: var(--text-muted); }

@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } body { padding: 14px; } }
</style>
</head>
<body>

<h1>Finanzas familiares</h1>
<p class="subtitle" id="genDate"></p>

<div class="alert-bar" id="alertBar">
  <div class="alert-title">⚠ Alertas</div>
  <ul id="alertList"></ul>
</div>

<div class="tabs" id="tabs"></div>
<div class="kpi-row" id="kpis"></div>

<div class="grid">
  <div class="card full"><h3>Gasto mensual</h3><canvas id="cMonthly" height="70"></canvas></div>
  <div class="card full"><h3>Desglose por subcategoría</h3><canvas id="cMerch" height="140"></canvas></div>
  <div class="card full"><h3>Ingresos</h3><div id="incomeWrap"></div></div>
  <div class="card full"><h3>Ahorro e inversión</h3><div id="savingsWrap"></div></div>
  <div class="card full" id="insightsCard" style="display:none"><h3>Insights</h3><div id="insightsWrap"></div></div>
  <div class="card full"><div class="card-header"><h3>Desglose por categoría</h3><button class="expand-all-btn" id="expandAllBtn">Expandir todo</button></div><div id="tableWrap"></div></div>
</div>

<script>
let D, Y = null, charts = {};
const MN = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const YC = {'2024':{bg:'rgba(99,102,241,0.15)',b:'#6366f1'},'2025':{bg:'rgba(34,197,94,0.15)',b:'#22c55e'},'2026':{bg:'rgba(245,158,11,0.15)',b:'#f59e0b'},'2027':{bg:'rgba(6,182,212,0.15)',b:'#06b6d4'},'2028':{bg:'rgba(236,72,153,0.15)',b:'#ec4899'}};
const CC = ['#6366f1','#22c55e','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#06b6d4','#84cc16','#e879f9','#fb923c','#a78bfa','#34d399','#fbbf24','#f87171','#818cf8','#4ade80','#fcd34d','#fb7185'];
Chart.defaults.color = '#8b8d98';
Chart.defaults.borderColor = '#2a2d3a';
Chart.defaults.font.family = "-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif";

const fmt = n => Math.abs(n).toLocaleString('es-ES',{minimumFractionDigits:0,maximumFractionDigits:0})+' €';
const fmt2 = n => Math.abs(n).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';

const CAT_ICONS = {
  hipoteca:'🏠', suministros:'💡',
  'suministros/luz':'💡', 'suministros/agua':'💧', 'suministros/gas':'🔥', 'suministros/internet':'📡',
  alimentacion:'🛒', restaurantes:'🍽️',
  compras:'🛍️', salud:'💊', estetica:'💇', seguros:'🛡️', ninos:'👶',
  hogar:'🏡', vehiculo:'🚗', suscripciones:'📺', ocio:'🎭', vacaciones:'🏖️',
  mascota:'🐾', ahorros:'💰', bizums:'🔀', traspasos_internos:'↔️',
  donaciones:'❤️', financiero:'🏦', sin_categoria:'❓', ingresos:'💵',
  'restaurantes/cafes_desayunos':'☕', 'restaurantes/comida_llevar':'🥡',
  'restaurantes/restaurante':'🍽️', 'restaurantes/celebraciones':'🎂',
  'compras/ropa':'👗', 'compras/deporte':'⚽', 'compras/segunda_mano':'♻️', 'compras/otros':'📦',
  'salud/farmacia':'💊', 'salud/tratamientos':'🩺', 'salud/gimnasio':'🏋️',
  'salud/suplementacion':'💪', 'salud/optica':'👓',
  'estetica/peluqueria':'💇', 'estetica/cosmetica':'✨',
  'seguros/hogar_vida':'🏠', 'seguros/coche':'🚗', 'seguros/mutua_salud':'🏥',
  'ninos/guarderia':'🧒', 'ninos/colegio':'🏫', 'ninos/extraescolares':'📚',
  'ninos/ropa_calzado':'👟', 'ninos/actividades':'🎪', 'ninos/medico':'🩺', 'ninos/otros':'🧸',
  'hogar/mantenimiento':'🔧', 'hogar/mobiliario':'🛋️', 'hogar/limpieza':'🧹', 'hogar/suministros':'🔩',
  'vehiculo/parking':'🅿️', 'vehiculo/combustible':'⛽', 'vehiculo/mantenimiento':'🔧',
  'vehiculo/prestamo':'💳', 'vehiculo/multas':'📋',
  'suscripciones/streaming':'📺', 'suscripciones/apps':'📱', 'suscripciones/gaming':'🎮',
  'ocio/cine_teatro':'🎬', 'ocio/deporte_eventos':'🏟️', 'ocio/juegos_libros':'📖',
  'ingresos/nomina':'💰', 'ingresos/otros':'💵',
};
function catIcon(key) { return CAT_ICONS[key] || CAT_ICONS[mainCat(key)] || ''; }

const EXCLUDE_FROM_EXPENSE = ['ahorros','traspasos_internos','ingresos','devoluciones'];
const SAVINGS_CATS = ['ahorros'];
const INCOME_CATS = ['ingresos'];
function isExcluded(c) { return EXCLUDE_FROM_EXPENSE.some(e => c === e || c.startsWith(e + '/')); }

function mainCat(c) { return c.includes('/') ? c.split('/')[0] : c; }

function render() {
  [renderAlerts, renderTabs, renderKPIs, renderMonthly, renderMerch, renderIncome, renderSavings, renderInsights, renderTable].forEach(fn => {
    try { fn(); } catch(e) { console.error(fn.name, e); }
  });
}

function renderAlerts() {
  const bar = document.getElementById('alertBar');
  const list = document.getElementById('alertList');
  const alerts = D.alerts || [];
  if (alerts.length === 0) { bar.style.display = 'none'; return; }
  bar.style.display = '';
  list.innerHTML = alerts.map(a => `<li><span class="alert-icon">${a.icon||'⚠'}</span>${a.text}</li>`).join('');
}

function renderTabs() {
  const w = document.getElementById('tabs');
  w.innerHTML = '';
  const mkBtn = (label, cls, val) => {
    const b = document.createElement('button');
    b.className = 'tab ' + cls + (Y === val ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { Y = val; render(); };
    w.appendChild(b);
  };
  mkBtn('Comparativa','compare',null);
  D.years.forEach(y => mkBtn(y,'',y));
}

function yearData(y) {
  const cats = D.cat_totals[y] || {};
  let gastos = 0, ahorro = 0, ingresos = 0, ingresosSubs = {};
  for (const [c,v] of Object.entries(cats)) {
    if (SAVINGS_CATS.some(s => c.startsWith(s))) ahorro += v;
    else if (INCOME_CATS.some(s => c.startsWith(s))) { ingresos += v; ingresosSubs[c] = v; }
    else if (!isExcluded(c)) gastos += v;
  }
  const months = Object.keys(D.monthly_totals[y] || {}).length;
  return { gastos, ahorro, ingresos, ingresosSubs, months, sinCat: D.summary[y]?.sin_categoria || 0, mov: D.summary[y]?.movimientos || 0 };
}

function renderKPIs() {
  const w = document.getElementById('kpis');
  if (Y) {
    const d = yearData(Y);
    const avg = d.months > 0 ? d.gastos / d.months : 0;
    const balance = d.ingresos - d.gastos - d.ahorro;
    const balCls = balance >= 0 ? 'pos' : 'neg';
    w.innerHTML = `
      <div class="kpi"><div class="label">Ingresos</div><div class="val pos">${fmt(d.ingresos)}</div><div class="sub">${d.months} meses</div></div>
      <div class="kpi"><div class="label">Gasto total</div><div class="val neg">${fmt(d.gastos)}</div><div class="sub">${d.mov} movimientos</div></div>
      <div class="kpi"><div class="label">Ahorro</div><div class="val pos">${fmt(d.ahorro)}</div><div class="sub">${d.ahorro !== 0 ? 'Fondos e inversión' : ''}</div></div>
      <div class="kpi"><div class="label">Balance neto</div><div class="val ${balCls}">${balance>=0?'+':'−'}${fmt(Math.abs(balance))}</div><div class="sub">Ingresos − gasto − ahorro</div></div>
      <div class="kpi"><div class="label">Media mensual</div><div class="val neg">${fmt(avg)}</div><div class="sub">${d.months} meses</div></div>
      <div class="kpi"><div class="label">Sin categoría</div><div class="val ${d.sinCat > 50 ? 'warn' : 'neut'}">${d.sinCat}</div><div class="sub">pendientes</div></div>
    `;
  } else {
    w.innerHTML = D.years.map(y => {
      const d = yearData(y);
      const label = y === D.years[D.years.length-1] && d.months < 12 ? y+' (parcial)' : y;
      const balance = d.ingresos - d.gastos - d.ahorro;
      const balCls = balance >= 0 ? 'pos' : 'neg';
      return `<div class="kpi"><div class="label">${label}</div><div class="val neg">${fmt(d.gastos)}</div><div class="sub">${d.ingresos>0?'Ingresos '+fmt(d.ingresos)+' · ':''}${d.mov} mov</div></div>`;
    }).join('');
  }
}

function renderMonthly() {
  const ctx = document.getElementById('cMonthly').getContext('2d');
  if (charts.m) charts.m.destroy();
  const yrs = Y ? [Y] : D.years;
  const ds = yrs.map(y => {
    const d = D.monthly_totals[y] || {};
    const vals = [];
    for (let m=1;m<=12;m++) {
      const mbc = D.monthly_by_cat[y]?.[String(m)] || {};
      let total = 0;
      for (const [c,v] of Object.entries(mbc)) {
        if (!SAVINGS_CATS.some(s => c.startsWith(s)) && !isExcluded(c)) total += v;
      }
      vals.push(total !== 0 ? Math.abs(total) : null);
    }
    const c = YC[y]||YC['2024'];
    return {label:y,data:vals,backgroundColor:c.bg,borderColor:c.b,borderWidth:2,fill:true,tension:0.3,pointRadius:4,pointHoverRadius:6,spanGaps:false};
  });
  charts.m = new Chart(ctx,{type:'line',data:{labels:MN,datasets:ds},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.raw)}},legend:{position:'top'}},scales:{y:{beginAtZero:true,ticks:{callback:v=>fmt(v)}},x:{grid:{display:false}}}}});
}

function renderMerch() {
  const ctx = document.getElementById('cMerch').getContext('2d');
  if (charts.mr) charts.mr.destroy();

  const years = Y ? [Y] : D.years;
  const mains = {};
  const allSubs = new Set();
  years.forEach(y => {
    for (const [c,v] of Object.entries(D.cat_totals[y]||{})) {
      if (isExcluded(c) || SAVINGS_CATS.some(s=>c.startsWith(s))) continue;
      if (c === 'sin_categoria') continue;
      const m = mainCat(c);
      const sub = c.includes('/') ? c.split('/').slice(1).join('/') : '_total';
      if (!mains[m]) mains[m] = {};
      mains[m][sub] = (mains[m][sub]||0) + v;
      allSubs.add(sub);
    }
  });

  const sorted = Object.entries(mains).map(([m,subs]) => {
    const total = Object.values(subs).reduce((s,v)=>s+v,0);
    return [m, subs, total];
  }).sort((a,b)=>b[2]-a[2]);

  const labels = sorted.map(([m])=>(catIcon(m)?catIcon(m)+' ':'')+(D.cat_labels[m]||m));

  const subTotals = {};
  sorted.forEach(([,subs]) => {
    for (const [sub,v] of Object.entries(subs)) { subTotals[sub] = (subTotals[sub]||0) + v; }
  });
  const subKeys = Object.entries(subTotals).sort((a,b)=>b[1]-a[1]).map(([k])=>k);

  const datasets = subKeys.map((sub, i) => ({
    label: sub === '_total' ? 'general' : sub.replace(/_/g,' '),
    data: sorted.map(([,subs]) => Math.abs(subs[sub]||0)),
    backgroundColor: CC[i % CC.length],
    borderColor: '#1a1d27',
    borderWidth: 1,
    borderRadius: 2,
  }));

  charts.mr = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true,
      indexAxis: 'y',
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => {
              if (!items.length) return '';
              const idx = items[0].dataIndex;
              const total = datasets.reduce((s,ds) => s + (ds.data[idx]||0), 0);
              return items[0].label + ' — Total: ' + fmt(total);
            },
            label: c => c.dataset.label + ': ' + fmt(c.raw)
          }
        }
      },
      scales: {
        x: { stacked: true, ticks: { callback: v => fmt(v) } },
        y: { stacked: true, grid: { display: false } }
      }
    }
  });
}

function renderIncome() {
  const w = document.getElementById('incomeWrap');
  const years = Y ? [Y] : D.years;
  let html = '';
  years.forEach(y => {
    const d = yearData(y);
    if (d.ingresos === 0) return;
    const months = d.months;
    const monthlyAvg = months > 0 ? d.ingresos / months : 0;

    const prevY = String(Number(y)-1);
    let deltaHtml = '';
    if (D.years.includes(prevY)) {
      const pd = yearData(prevY);
      const prevAvg = pd.months > 0 ? pd.ingresos / pd.months : 0;
      if (prevAvg > 0) {
        const delta = ((monthlyAvg - prevAvg) / prevAvg * 100).toFixed(0);
        const cls = Number(delta) >= 0 ? 'pos' : 'neg';
        deltaHtml = ` <span class="${cls}" style="font-size:0.8rem">(${Number(delta)>=0?'+':''}${delta}% vs ${prevY})</span>`;
      }
    }

    const subs = Object.entries(d.ingresosSubs).sort((a,b) => b[1]-a[1]);
    const total = d.ingresos;
    const barParts = subs.map(([cat, val], i) => {
      const pct = (val / total * 100).toFixed(1);
      const label = D.cat_labels[cat] || cat.split('/').pop().replace(/_/g,' ');
      const colors = ['var(--green)', 'var(--cyan)', 'var(--accent)', 'var(--orange)'];
      const color = colors[i % colors.length];
      return { label, val, pct, color };
    });

    html += `<div style="margin-bottom:14px">
      <div style="font-size:0.85rem;font-weight:600">💵 ${y}${months<12?' (parcial)':''}: <span class="pos">${fmt(total)}</span>${deltaHtml}</div>
      <div style="font-size:0.75rem;color:var(--text-muted);margin:4px 0">${fmt(monthlyAvg)}/mes</div>
      <div style="display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0">
        ${barParts.map(p => `<div style="width:${p.pct}%;background:${p.color}" title="${p.label}: ${fmt(p.val)} (${p.pct}%)"></div>`).join('')}
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:4px">
        ${barParts.map(p => `<span style="font-size:0.75rem;color:var(--text-muted)"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${p.color};margin-right:4px"></span>${p.label}: ${fmt(p.val)}</span>`).join('')}
      </div>
    </div>`;
  });
  w.innerHTML = html || '<div style="font-size:0.82rem;color:var(--text-muted)">Sin datos de ingresos</div>';
}

function renderSavings() {
  const w = document.getElementById('savingsWrap');
  let html = '';
  const years = Y ? [Y] : D.years;
  years.forEach(y => {
    const d = yearData(y);
    const saving = Math.abs(d.ahorro);
    const spending = Math.abs(d.gastos);
    const total = saving + spending;
    const pct = total > 0 ? (saving / total * 100) : 0;
    const color = pct >= 15 ? 'var(--green)' : pct >= 10 ? 'var(--orange)' : 'var(--red)';
    const months = d.months;
    const monthlyAvg = months > 0 ? saving / months : 0;

    const prevY = String(Number(y)-1);
    let deltaHtml = '';
    if (D.years.includes(prevY)) {
      const pd = yearData(prevY);
      const prevMonthlyAvg = pd.months > 0 ? Math.abs(pd.ahorro) / pd.months : 0;
      if (prevMonthlyAvg > 0) {
        const delta = ((monthlyAvg - prevMonthlyAvg) / prevMonthlyAvg * 100).toFixed(0);
        const cls = Number(delta) >= 0 ? 'pos' : 'neg';
        deltaHtml = ` <span class="${cls}" style="font-size:0.8rem">(${Number(delta)>=0?'+':''}${delta}% vs ${prevY})</span>`;
      }
    }

    html += `<div style="margin-bottom:14px">
      <div style="font-size:0.85rem;font-weight:600">${y}${months<12?' (parcial)':''}: <span class="pos">${fmt(saving)}</span> ahorrados${deltaHtml}</div>
      <div style="font-size:0.75rem;color:var(--text-muted);margin:4px 0">${fmt(monthlyAvg)}/mes · ${pct.toFixed(1)}% del total (gasto + ahorro)</div>
      <div class="savings-bar"><div class="savings-track"><div class="savings-fill" style="width:${pct}%;background:${color}"></div></div><span style="font-size:0.8rem;color:${color}">${pct.toFixed(0)}%</span></div>
    </div>`;
  });
  w.innerHTML = html;
}

function renderInsights() {
  const card = document.getElementById('insightsCard');
  const w = document.getElementById('insightsWrap');
  const insights = D.insights || [];
  if (insights.length === 0) { card.style.display = 'none'; return; }
  card.style.display = '';
  w.innerHTML = insights.map(i => {
    const cls = i.direction === 'up' ? 'up' : i.direction === 'down' ? 'down' : 'info';
    return `<div class="insight-item"><div class="insight-type ${cls}">${i.label || i.type}</div><div class="insight-text">${i.text}</div></div>`;
  }).join('');
}

function renderTable() {
  const w = document.getElementById('tableWrap');
  if (!Y) { renderTableCompare(w); return; }
  renderTableYear(w, Y);
}

function renderTableCompare(w) {
  const yearGroups = {};
  D.years.forEach(y => {
    const groups = {};
    for (const [c,v] of Object.entries(D.cat_totals[y]||{})) {
      if (isExcluded(c) || SAVINGS_CATS.some(s=>c.startsWith(s))) continue;
      const m = mainCat(c);
      if (!groups[m]) groups[m] = {total:0, subs:{}};
      groups[m].total += v;
      if (c.includes('/')) {
        const sub = c.split('/').slice(1).join('/');
        groups[m].subs[sub] = (groups[m].subs[sub]||0) + v;
      }
    }
    yearGroups[y] = groups;
  });

  const allCats = new Set();
  D.years.forEach(y => Object.keys(yearGroups[y]).forEach(c => allCats.add(c)));

  const sorted = [...allCats].map(cat => {
    let total = 0;
    D.years.forEach(y => { total += yearGroups[y][cat]?.total || 0; });
    return [cat, total];
  }).sort((a,b)=>b[1]-a[1]);

  const allSubs = {};
  sorted.forEach(([cat]) => {
    const subs = new Set();
    D.years.forEach(y => {
      Object.keys(yearGroups[y][cat]?.subs || {}).forEach(s => subs.add(s));
    });
    allSubs[cat] = [...subs];
  });

  const colSpan = 2 + D.years.length;
  let html = `<table class="tbl"><thead><tr><th>Categoría</th>`;
  D.years.forEach(y => { html += `<th class="r">${y}</th>`; });
  html += `<th></th></tr></thead><tbody>`;

  const maxAbs = Math.max(...sorted.map(([,t])=>Math.abs(t)));

  sorted.forEach(([cat, totalAll]) => {
    const catLabel = D.cat_labels[cat] || cat;
    const icon = catIcon(cat);
    const hasSubs = allSubs[cat].length > 0;
    const toggleCls = hasSubs ? 'toggle-subs' : '';
    const toggleId = hasSubs ? `data-cat="${cat}"` : '';
    const indicator = hasSubs ? '<span class="toggle-indicator">▸</span>' : '';
    const barW = maxAbs > 0 ? (Math.abs(totalAll)/maxAbs*100).toFixed(1) : 0;

    const detailBtn = `<button class="detail-btn" data-detail="${cat}" title="Ver conceptos y reglas">i</button>`;
    html += `<tr ${toggleId} class="${toggleCls}"><td>${icon ? icon+' ':''}${catLabel}${indicator}${detailBtn}</td>`;
    D.years.forEach(y => {
      const val = yearGroups[y][cat]?.total || 0;
      html += `<td class="amt">${val > 0 ? fmt2(val) : '—'}</td>`;
    });
    html += `<td class="bar-cell"><div class="bar" style="width:${barW}%"></div></td></tr>`;
    html += `<tr class="detail-panel" data-panel="${cat}" style="display:none"><td colspan="${colSpan}"><div class="detail-inner" data-detail-inner="${cat}"></div></td></tr>`;

    if (hasSubs) {
      allSubs[cat].sort((a,b) => {
        let ta=0, tb=0;
        D.years.forEach(y => { ta += yearGroups[y][cat]?.subs[a]||0; tb += yearGroups[y][cat]?.subs[b]||0; });
        return tb - ta;
      });
      allSubs[cat].forEach(sub => {
        const subLabel = sub.replace(/_/g,' ');
        const subFullKey = cat + '/' + sub;
        const subIcon = catIcon(subFullKey);
        const subDetailBtn = `<button class="detail-btn" data-detail="${subFullKey}" title="Ver conceptos y reglas">i</button>`;
        html += `<tr class="subrow sub-${cat}" style="display:none"><td>${subIcon ? subIcon+' ':''}${subLabel}${subDetailBtn}</td>`;
        D.years.forEach(y => {
          const val = yearGroups[y][cat]?.subs[sub] || 0;
          html += `<td class="amt">${val > 0 ? fmt2(val) : '—'}</td>`;
        });
        html += `<td></td></tr>`;
        html += `<tr class="detail-panel" data-panel="${subFullKey}" style="display:none"><td colspan="${colSpan}"><div class="detail-inner" data-detail-inner="${subFullKey}"></div></td></tr>`;
      });
    }
  });

  html += '</tbody></table>';
  w.innerHTML = html;
  bindTableEvents(w);
}

function renderTableYear(w, y) {
  const prevY = String(Number(y)-1);
  const hasPrev = D.years.includes(prevY);
  const cats = D.cat_totals[y] || {};
  const prevCats = D.cat_totals[prevY] || {};
  const months = Object.keys(D.monthly_totals[y]||{}).length;
  const prevMonths = Object.keys(D.monthly_totals[prevY]||{}).length;

  const groups = {};
  for (const [c,v] of Object.entries(cats)) {
    if (isExcluded(c) || SAVINGS_CATS.some(s=>c.startsWith(s))) continue;
    const m = mainCat(c);
    if (!groups[m]) groups[m] = {total:0, subs:{}};
    groups[m].total += v;
    if (c.includes('/')) {
      const sub = c.split('/').slice(1).join('/');
      groups[m].subs[sub] = (groups[m].subs[sub]||0) + v;
    }
  }

  const prevGroups = {};
  for (const [c,v] of Object.entries(prevCats)) {
    if (isExcluded(c) || SAVINGS_CATS.some(s=>c.startsWith(s))) continue;
    const m = mainCat(c);
    if (!prevGroups[m]) prevGroups[m] = {total:0};
    prevGroups[m].total += v;
  }

  const sorted = Object.entries(groups).sort((a,b)=>b[1].total-a[1].total);
  const totalGasto = sorted.reduce((s,[,d])=>s+d.total,0);
  const maxAbs = Math.max(...sorted.map(([,d])=>Math.abs(d.total)));
  const colSpan = hasPrev ? 5 : 4;

  let html = `<table class="tbl"><thead><tr><th>Categoría</th><th class="r">Importe</th><th class="r">%</th>${hasPrev?'<th class="r">vs '+prevY+'</th>':''}<th></th></tr></thead><tbody>`;

  sorted.forEach(([cat, data]) => {
    const pct = (data.total/totalGasto*100).toFixed(1);
    const barW = (Math.abs(data.total)/maxAbs*100).toFixed(1);
    const hasSubs = Object.keys(data.subs).length > 0;
    const catLabel = D.cat_labels[cat] || cat;

    let deltaHtml = '';
    if (hasPrev && prevGroups[cat] && months > 0 && prevMonths > 0) {
      const avgC = data.total/months, avgP = prevGroups[cat].total/prevMonths;
      const d = ((avgC-avgP)/Math.abs(avgP)*100).toFixed(0);
      deltaHtml = `<span class="${Number(d)>0?'delta-up':'delta-down'}">${Number(d)>0?'+':''}${d}%</span>`;
    }

    const toggleCls = hasSubs ? 'toggle-subs' : '';
    const toggleId = hasSubs ? `data-cat="${cat}"` : '';
    const indicator = hasSubs ? '<span class="toggle-indicator">▸</span>' : '';
    const detailBtn = `<button class="detail-btn" data-detail="${cat}" title="Ver conceptos y reglas">i</button>`;
    const icon = catIcon(cat);
    html += `<tr ${toggleId} class="${toggleCls}"><td>${icon ? icon+' ':''}${catLabel}${indicator}${detailBtn}</td><td class="amt">${fmt2(data.total)}</td><td class="pct">${pct}%</td>${hasPrev?'<td class="delta">'+deltaHtml+'</td>':''}<td class="bar-cell"><div class="bar" style="width:${barW}%"></div></td></tr>`;
    html += `<tr class="detail-panel" data-panel="${cat}" style="display:none"><td colspan="${colSpan}"><div class="detail-inner" data-detail-inner="${cat}"></div></td></tr>`;

    if (hasSubs) {
      const subSorted = Object.entries(data.subs).sort((a,b)=>b[1]-a[1]);
      subSorted.forEach(([sub,val]) => {
        const subPct = (val/data.total*100).toFixed(0);
        const subLabel = sub.replace(/_/g,' ');
        const subFullKey = cat + '/' + sub;
        const subDetailBtn = `<button class="detail-btn" data-detail="${subFullKey}" title="Ver conceptos y reglas">i</button>`;
        const subIcon = catIcon(subFullKey);
        html += `<tr class="subrow sub-${cat}" style="display:none"><td>${subIcon ? subIcon+' ':''}${subLabel}${subDetailBtn}</td><td class="amt">${fmt2(val)}</td><td class="pct">${subPct}%</td>${hasPrev?'<td></td>':''}<td></td></tr>`;
        html += `<tr class="detail-panel" data-panel="${subFullKey}" style="display:none"><td colspan="${colSpan}"><div class="detail-inner" data-detail-inner="${subFullKey}"></div></td></tr>`;
      });
    }
  });

  html += '</tbody></table>';
  w.innerHTML = html;
  bindTableEvents(w);
}

function bindTableEvents(w) {
  w.querySelectorAll('.detail-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const cat = btn.dataset.detail;
      const panel = document.querySelector(`[data-panel="${cat}"]`);
      if (!panel) return;
      const isOpen = panel.style.display !== 'none';
      w.querySelectorAll('.detail-panel').forEach(p => p.style.display = 'none');
      w.querySelectorAll('.detail-btn').forEach(b => b.classList.remove('active'));
      if (!isOpen) {
        panel.style.display = '';
        btn.classList.add('active');
        fillDetail(cat);
      }
    });
  });

  w.querySelectorAll('.toggle-subs').forEach(tr => {
    tr.addEventListener('click', (e) => {
      if (e.target.closest('.detail-btn')) return;
      const cat = tr.dataset.cat;
      const subs = w.querySelectorAll('.sub-'+cat);
      const open = tr.classList.toggle('open');
      subs.forEach(s => s.style.display = open ? '' : 'none');
      if (!open) {
        subs.forEach(s => { const b = s.querySelector('.detail-btn'); if(b) b.classList.remove('active'); });
      }
      updateExpandBtn();
    });
  });

  const expandBtn = document.getElementById('expandAllBtn');
  if (expandBtn) {
    expandBtn.addEventListener('click', () => {
      const toggles = w.querySelectorAll('.toggle-subs');
      const anyOpen = [...toggles].some(t => t.classList.contains('open'));
      toggles.forEach(tr => {
        const cat = tr.dataset.cat;
        const subs = w.querySelectorAll('.sub-'+cat);
        if (anyOpen) { tr.classList.remove('open'); subs.forEach(s => s.style.display = 'none'); }
        else { tr.classList.add('open'); subs.forEach(s => s.style.display = ''); }
      });
      updateExpandBtn();
    });
  }
  updateExpandBtn();
}

function fillDetail(cat) {
  const years = Y ? [Y] : D.years;
  const el = document.querySelector(`[data-detail-inner="${cat}"]`);
  if (!el) return;

  const merged = {};
  years.forEach(y => {
    const cbc = D.concepts_by_cat[y] || {};
    const keys = cat.includes('/') ? [cat] : Object.keys(cbc).filter(k => k === cat || k.startsWith(cat + '/'));
    keys.forEach(k => {
      (cbc[k] || []).forEach(([name, count, total]) => {
        if (!merged[name]) merged[name] = {count:0, total:0};
        merged[name].count += count;
        merged[name].total += total;
      });
    });
  });
  let concepts = Object.entries(merged).map(([n,d]) => [n, d.count, d.total]).sort((a,b) => a[2]-b[2]);

  let patterns = [];
  const pm = D.patterns_map || {};
  if (cat.includes('/')) {
    patterns = pm[cat] || [];
  } else {
    for (const [k, arr] of Object.entries(pm)) {
      if (k === cat || k.startsWith(cat + '/')) patterns = patterns.concat(arr);
    }
  }

  let conceptsHtml = '';
  if (concepts.length > 0) {
    conceptsHtml = concepts.map(([name, count, total]) =>
      `<li><span class="name" title="${name}">${name}</span><span class="val">${count}x ${fmt(total)}</span></li>`
    ).join('');
  } else {
    conceptsHtml = '<li style="color:var(--text-muted)">Sin movimientos</li>';
  }

  let patternsHtml = '';
  if (patterns.length > 0) {
    patternsHtml = patterns.map(p => `<li>${p}</li>`).join('');
  } else {
    patternsHtml = '<li>Sin patterns</li>';
  }

  el.innerHTML = `
    <div class="detail-col">
      <h4>Conceptos del extracto (${Y || 'todos'})</h4>
      <ul>${conceptsHtml}</ul>
    </div>
    <div class="detail-col">
      <h4>Patterns en rules.yaml (${patterns.length})</h4>
      <ul class="pattern-list">${patternsHtml}</ul>
    </div>
  `;
}

function updateExpandBtn() {
  const btn = document.getElementById('expandAllBtn');
  if (!btn) return;
  const toggles = document.querySelectorAll('.toggle-subs');
  const anyOpen = [...toggles].some(t => t.classList.contains('open'));
  btn.textContent = anyOpen ? 'Colapsar todo' : 'Expandir todo';
}

fetch('data.json').then(r=>r.json()).then(d=>{
  D=d;
  document.getElementById('genDate').textContent = 'Generado: '+(d.generated_at||'—');
  render();
}).catch(()=>{document.body.innerHTML='<p style="color:var(--red);padding:40px">Error cargando data.json</p>';});
</script>
</body>
</html>
