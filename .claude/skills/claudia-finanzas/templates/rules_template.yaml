      - mutua madrilena

  seguros/mutua_salud:
    label: "Seguros / Mutua salud"
    patterns:
      - sanitas
      - adeslas
      - asisa
      - dkv

  # ── NIÑOS ──
  ninos/guarderia:
    label: "Niños / Guardería"
    patterns:
      - guarderia
      - escoleta
      - escuela infantil

  ninos/colegio:
    label: "Niños / Colegio"
    patterns:
      - colegio
      - comedor escolar

  ninos/extraescolares:
    label: "Niños / Extraescolares"
    patterns: []

  ninos/ropa_calzado:
    label: "Niños / Ropa y calzado"
    patterns:
      - kiabi
      - mango kids
      - vertbaudet
      - zippy
      - boboli

  ninos/actividades:
    label: "Niños / Actividades"
    patterns:
      - casal
      - campamento

  ninos/medico:
    label: "Niños / Médico"
    patterns: []

  ninos/otros:
    label: "Niños / Otros"
    patterns: []

  # ── HOGAR ──
  hogar/mantenimiento:
    label: "Hogar / Mantenimiento y mejoras"
    patterns:
      - leroy merlin
      - bricomart
      - brico depot
      - aki

  hogar/mobiliario:
    label: "Hogar / Mobiliario"
    patterns:
      - ikea
      - kenay
      - maisons du monde

  hogar/limpieza:
    label: "Hogar / Limpieza"
    patterns: []

  hogar/suministros:
    label: "Hogar / Pequeñas compras"
    patterns: []

  # ── VEHÍCULO ──
  vehiculo/parking:
    label: "Vehículo / Parking"
    patterns:
      - parking
      - easypark
      - telpark
      - parclick
      - empark

  vehiculo/combustible:
    label: "Vehículo / Combustible"
    patterns:
      - repsol
      - cepsa
      - bp
      - galp
      - shell
      - combustible
      - gasolinera

  vehiculo/mantenimiento:
    label: "Vehículo / Mantenimiento"
    patterns:
      - norauto
      - midas
      - feu vert
      - euromaster

  vehiculo/prestamo:
    label: "Vehículo / Préstamo"
    patterns:
      - cetelem

  vehiculo/multas:
    label: "Vehículo / Multas e impuestos"
    patterns:
      - sanciones
      - dgt

  # ── SUSCRIPCIONES (recurrentes digitales) ──
  suscripciones/streaming:
    label: "Suscripciones / Streaming"
    patterns:
      - netflix
      - disney plus
      - hbo
      - help.max.com
      - max.com
      - prime video
      - dazn
      - spotify
      - youtube premium
      - crunchyroll
      - filmin

  suscripciones/apps:
    label: "Suscripciones / Apps"
    patterns:
      - apple
      - itunesappst
      - google
      - icloud
      - canva
      - notion
      - chatgpt
      - openai
      - adobe
      - dropbox

  suscripciones/gaming:
    label: "Suscripciones / Gaming"
    patterns:
      - steamgames
      - steam
      - playstation
      - nintendo
      - xbox

  # ── OCIO (puntual) ──
  ocio/cine_teatro:
    label: "Ocio / Cine y teatro"
    patterns:
      - cines
      - cinesa
      - yelmo
      - ocine
      - teatro

  ocio/deporte_eventos:
    label: "Ocio / Deporte y eventos"
    patterns:
      - ticketmaster
      - entradas.com
      - eventbrite

  ocio/juegos_libros:
    label: "Ocio / Juegos y libros"
    patterns:
      - casa del libro
      - fnac

  # ── VACACIONES ──
  vacaciones:
    patterns:
      - booking
      - airbnb
      - hotel
      - camping

  # ── MASCOTA ──
  mascota:
    patterns:
      - kiwoko
      - tiendanimal
      - veterinar

  # ── AHORROS (no es gasto) ──
  ahorros:
    is_saving: true
    patterns:
      - coinbase
      - indexa capital
      - myinvestor
      - fondo

  # ── TRASPASOS INTERNOS (neutro) ──
  traspasos_internos:
    is_neutral: true
    patterns:
      - traspaso desde cuenta
      - traspaso a cuenta
      - transferencia entre cuentas

  # ── INGRESOS ──
  ingresos/nomina:
    label: "Ingresos / Nómina"
    is_income: true
    patterns:
      - nomina
      - nómina
      - abono de nomina

  ingresos/otros:
    label: "Ingresos / Otros"
    is_income: true
    patterns: []

  # ── BIZUMS (cajón de sastre) ──
  bizums:
    patterns:
      - bizum

  # ── FINANCIERO ──
  financiero:
    label: "Financiero / Comisiones"
    patterns:
      - comision
      - comisiones

  # ── DONACIONES ──
  donaciones:
    patterns:
      - donacion
      - ong
      - unicef
      - cruz roja
      - caritas

## Umbrales para sugerir desglose de merchants
enrich_thresholds:
  min_amount: 500
  min_transactions: 10

## Fallback LLM para movimientos sin match
llm_fallback: true
