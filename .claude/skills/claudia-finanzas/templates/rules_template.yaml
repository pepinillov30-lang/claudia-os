## Reglas de categorización — plantilla genérica
## Se copia a user/workspaces/finanzas/rules.yaml en el primer uso.
## El usuario añade sus merchants específicos; esta plantilla cubre los más comunes.
##
## Match: case-insensitive, contains. Patrón más largo matchea primero.
## Formato subcategoría: "categoria/subcategoria" en el campo categoria del CSV.

categories:

  # ── HIPOTECA ──
  hipoteca:
    patterns:
      - amortizacion de prestamo

  # ── SUMINISTROS ──
  suministros/luz:
    label: "Suministros / Luz"
    patterns:
      - iberdrola
      - endesa
      - naturgy
      - holaluz
      - repsol luz
      - factor energia
      - som energia
      - lucera
      - octopus energy

  suministros/agua:
    label: "Suministros / Agua"
    patterns:
      - canal de isabel segunda
      - agbar
      - aigues de barcelona
      - emasesa
      - emasa
      - aqualia

  suministros/gas:
    label: "Suministros / Gas"
    patterns:
      - naturgy gas
      - redexis
      - nedgia

  suministros/internet:
    label: "Suministros / Internet y móvil"
    patterns:
      - movistar
      - vodafone
      - orange
      - o2
      - mas movil
      - masmovil
      - digi
      - pepephone
      - pepe mobile
      - lowi
      - jazztel
      - yoigo
      - simyo
      - finetwork

  # ── ALIMENTACIÓN ──
  alimentacion/supermercado:
    label: "Alimentación / Supermercado"
    patterns:
      - mercadona
      - lidl
      - carrefour
      - aldi
      - dia supermercado
      - eroski
      - alcampo
      - hipercor
      - bon preu
      - bonpreu
      - consum
      - condis
      - ahorramas
      - spar
      - caprabo
      - gadis
      - coviran
      - mas supermercat
      - super
      - hipermercat

  alimentacion/especialidad:
    label: "Alimentación / Especialidad"
    patterns:
      - naturitas
      - planeta huerto
      - planetahuerto
      - herbolario

  # ── RESTAURANTES ──
  restaurantes/comida_llevar:
    label: "Restaurantes / Comida para llevar"
    patterns:
      - glovo
      - uber eats
      - just eat
      - deliveroo

  restaurantes/celebraciones:
    label: "Restaurantes / Celebraciones (pasteles etc.)"
    patterns: []

  restaurantes/cafes_desayunos:
    label: "Restaurantes / Cafés y desayunos"
    amount_threshold: -20
    patterns:
      - starbucks
      - cafeteria
      - cafe
      - fleca
      - forn
      - pastisseria
      - pasteleria
      - panaderia

  restaurantes/restaurante:
    label: "Restaurantes / Restaurante"
    patterns:
      - mc donalds
      - burger king
      - telepizza
      - dominos
      - foster hollywood
      - vips
      - taco bell
      - kfc
      - five guys
      - goiko
      - la tagliatella
      - restaurant
      - restaurante

  # ── COMPRAS ──
  compras/ropa:
    label: "Compras / Ropa y calzado"
    patterns:
      - zara
      - pull and bear
      - mango
      - primark
      - massimo dutti
      - lefties
      - oysho
      - zalandose
      - zalando
      - uniqlo
      - h&m
      - bershka
      - stradivarius
      - intimissimi
      - calzedonia
      - women secret
      - womensecret
      - tendam
      - cortefiel

  compras/deporte:
    label: "Compras / Deporte"
    patterns:
      - decathlon
      - sprinter
      - sport zone
      - forum sport

  compras/segunda_mano:
    label: "Compras / Segunda mano"
    patterns:
      - vinted
      - mgpvinted
      - wallapop
      - mgpwallapop
      - milanuncios

  compras/otros:
    label: "Compras / Otros"
    patterns:
      - amazon
      - amzn mktp
      - www.amazon
      - amazon.es
      - amazon prime
      - temu
      - aliexpress
      - ikea
      - mediamarkt
      - fnac
      - el corte ingles
      - pccomponentes
      - miravia
      - etsy
      - tiger
      - abacus
      - casa del libro

  # ── SALUD ──
  salud/farmacia:
    label: "Salud / Farmacia"
    patterns:
      - farmacia
      - parafarmacia
      - promofarma
      - dosfarma
      - mifarma

  salud/tratamientos:
